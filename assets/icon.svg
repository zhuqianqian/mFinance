  </g>
  <polyline points="134,268 226,208 306,244 386,150" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="386" cy="150" r="20" fill="#ffffff"/>
  <circle cx="386" cy="150" r="9" fill="#0a84ff"/>
